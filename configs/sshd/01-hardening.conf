# P01 SSH hardening - deployed to /etc/ssh/sshd_config.d/
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
# 'ubuntu' kept ONLY because multipass shell uses it as our rescue console.
# On a real VPS: AllowUsers deploy
AllowUsers deploy ubuntu